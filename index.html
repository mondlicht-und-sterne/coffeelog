<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>coffee.log V9.0</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f0f0f"><style>:root{--bg:#0f0f0f;--card:#191919;--b:#262626;--t:#f5f5f5;--m:#8a8a8a;--a:#d4a373}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui}.wrap{max-width:820px;margin:0 auto;padding:16px}.search{width:100%;background:#1f1f1f;border:1px solid var(--b);border-radius:24px;padding:11px 40px;color:var(--t);outline:none}.swrap{position:relative;margin:12px 0}.sicon{position:absolute;left:14px;top:11px;color:var(--m)}.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--b);color:var(--m);font-size:11px;cursor:pointer;white-space:nowrap}.chip.on{background:var(--a);color:#000;font-weight:700}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px;font-size:12px}.btn{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:10px;color:var(--t);font-weight:600;cursor:pointer;width:100%;font-size:12px}.btn-a{background:var(--a);color:#000;border-color:var(--a)}.btn-s{background:#212121;color:#ccc;font-size:11px}.item{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:10px 12px;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.del{background:#3a1a1a;border:1px solid #a44;border-radius:8px;padding:6px 10px;color:#f88;cursor:pointer}.submenu{position:absolute;top:42px;left:0;right:0;background:#222;border:1.5px solid var(--a);border-radius:12px;z-index:20;display:none;max-height:340px;overflow-y:auto}.submenu div{padding:11px 14px;font-size:12px;cursor:pointer;border-bottom:1px solid #333}.submenu div:last-child{border:none}.submenu div:hover{background:#333;color:var(--a)}.box{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin-top:16px}.row{display:flex;gap:8px;margin-top:8px}.input{background:#1f1f1f;border:1px solid var(--b);border-radius:10px;padding:10px;color:var(--t);width:100%;font-size:13px}</style></head><body><div class="wrap">
<h2 style="margin:0">coffee.log V9.0</h2><small style="color:#8a8a8a">Export / Import</small>
<div class="swrap"><span class="sicon">🔍</span><input id="search" class="search" placeholder="Suche..." oninput="render()"></div>
<div class="chips" id="chips"></div><div class="grid" id="stats"></div>
<div class="grid">
<div style="position:relative"><button class="btn" id="cremeBtn" onclick="toggleMenu('cremeMenu')">Café Crème ▼</button><div class="submenu" id="cremeMenu"><div onclick="addCoffee('Café Crème')">Café Crème</div><div onclick="addCoffee('Großer Café Crème „Pott“')">Großer Café Crème „Pott“</div></div></div>
<div style="position:relative"><button class="btn btn-a" id="espBtn" onclick="toggleMenu('espMenu')">Espresso ▼</button><div class="submenu" id="espMenu"><div onclick="addCoffee('Espresso')">Espresso</div><div onclick="addCoffee('Espresso Ristretto')">Espresso Ristretto</div><div onclick="addCoffee('Espresso Lungo')">Espresso Lungo</div><div onclick="addCoffee('Espresso Macchiato')">Espresso Macchiato</div><div onclick="addCoffee('Espresso Doppio')">Espresso Doppio</div><div onclick="addCoffee('Espresso Doppio Macchiato')">Espresso Doppio Macchiato</div><div onclick="addCoffee('Espresso Affogato')">Espresso Affogato</div><div onclick="addCoffee('Extra-Shot Espresso')">Extra-Shot Espresso</div></div></div>
<div style="position:relative"><button class="btn" id="latteBtn" onclick="toggleMenu('latteMenu')">Latte ▼</button><div class="submenu" id="latteMenu"><div onclick="addCoffee('Latte Macchiato')">Latte Macchiato</div><div onclick="addCoffee('Iced Latte')">Iced Latte</div></div></div>
</div>
<div class="grid" style="grid-template-columns:repeat(5,1fr)">
<button class="btn btn-s" onclick="addCoffee('Filter')">Filter</button>
<button class="btn btn-s" onclick="addCoffee('Cappuccino')">Cappuccino</button>
<button class="btn btn-s" onclick="addCoffee('Milchkaffee')">Milchkaffee</button>
<button class="btn btn-s" onclick="addCoffee('Flat White')">Flat White</button>
<button class="btn btn-s" onclick="addCoffee('Kaffeelikör')">Kaffeelikör</button>
</div>
<div id="list"></div>
<div class="box"><h3 style="font-size:12px;color:#8a8a8a;margin:0">⚙️ SPEICHER</h3><div style="display:flex;gap:14px;font-size:12px;margin:8px 0"><label><input type="radio" name="mode" value="local" checked onchange="setMode()"> Lokal</label><label><input type="radio" name="mode" value="key" onchange="setMode()"> Key</label><label><input type="radio" name="mode" value="nextcloud" onchange="setMode()"> Nextcloud</label></div><div id="keyBox" style="display:none"><input id="keyInput" class="input" placeholder="moooon-dresden-123"><div class="row"><input id="shareLink" class="input" readonly><button class="btn" style="width:80px" onclick="copyLink()">Copy</button></div><button class="btn" style="margin-top:6px" onclick="saveKey()">Setzen</button></div><div id="ncBox" style="display:none"><input id="ncUrl" class="input" placeholder="https://cloud.example.com"><div class="row"><input id="ncUser" class="input" placeholder="User"><input id="ncPass" class="input" type="password" placeholder="App-Passwort"></div><input id="ncPath" class="input" value="/coffee.log/coffee.json"><div class="row"><button class="btn btn-a" onclick="ncSave()">Sync → Cloud</button><button class="btn" onclick="ncLoad()">← Laden</button></div><div id="ncStatus" style="font-size:10px;color:#d4a373"></div></div><div class="row"><button class="btn" onclick="exportJSON()">Export</button><button class="btn" onclick="document.getElementById('imp').click()">Import</button><input type="file" id="imp" hidden accept=".json" onchange="importJSON(event)"></div></div></div>
<script>
let mode=localStorage.getItem("cl_mode")||"local",keyName=localStorage.getItem("cl_key")||"";
function sk(){return mode==="key"&&keyName?"coffee_"+keyName:"coffee_v84"}function loadData(){try{return JSON.parse(localStorage.getItem(sk())||"[]")}catch{return[]}}let data=loadData(),activeChip="Alle";
function setMode(){mode=document.querySelector('input[name=mode]:checked').value;localStorage.setItem("cl_mode",mode);document.getElementById("keyBox").style.display=mode==="key"?"block":"none";document.getElementById("ncBox").style.display=mode==="nextcloud"?"block":"none";data=loadData();render()}
function saveKey(){let v=document.getElementById("keyInput").value.trim().replace(/\s+/g,"-");if(!v)return;let old=loadData();keyName=v;localStorage.setItem("cl_key",v);localStorage.setItem(sk(),JSON.stringify(old));location.hash=v;render()}
function updateShareLink(){let b=location.origin+location.pathname;document.getElementById("shareLink").value=b+"#"+(keyName||"key");document.getElementById("keyInput").value=keyName}function copyLink(){document.getElementById("shareLink").select();document.execCommand("copy")}
function saveLocal(){localStorage.setItem(sk(),JSON.stringify(data))}
function toggleMenu(id){document.querySelectorAll('.submenu').forEach(m=>{if(m.id!==id)m.style.display="none"});let m=document.getElementById(id);m.style.display=m.style.display==="block"?"none":"block"}document.addEventListener('click',e=>{if(!e.target.closest('#cremeBtn')&&!e.target.closest('#espBtn')&&!e.target.closest('#latteBtn')&&!e.target.closest('.submenu'))document.querySelectorAll('.submenu').forEach(m=>m.style.display="none")})
function renderChips(){let c=document.getElementById("chips");c.innerHTML="";["Alle","Crème","Espresso","Latte","Milchkaffee","Flat","Likör"].forEach(t=>{let d=document.createElement("div");d.className="chip"+(activeChip===t?" on":"");d.textContent=t;d.onclick=()=>{activeChip=t;render()};c.appendChild(d)})}
function filtered(){let term=document.getElementById("search").value.toLowerCase();return data.slice().reverse().map((e,i)=>({...e,origIdx:data.length-1-i})).filter(e=>{if(activeChip!=="Alle"){if(!e.type.toLowerCase().includes(activeChip.toLowerCase()))return false}if(!term)return true;return e.type.toLowerCase().includes(term)})}
function render(){renderChips();let f=filtered();let today=data.filter(d=>new Date(d.ts).toDateString()===new Date().toDateString()).length;document.getElementById("stats").innerHTML=`<div class="card">Today<br><b style="font-size:18px">${today}</b></div><div class="card">Week<br><b style="font-size:18px">${data.filter(d=>(Date.now()-d.ts)/86400000<7).length}</b></div><div class="card">Filter<br><b style="font-size:18px">${f.length}</b></div>`;document.getElementById("list").innerHTML=f.map(e=>`<div class="item"><div><div style="font-size:9px;color:#8a8a8a">${new Date(e.ts).toLocaleString('de-DE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div><div style="font-weight:700">${e.type}</div></div><button class="del" onclick="delEntry(${e.origIdx})">🗑️</button></div>`).join("")||"<small style='color:#8a8a8a'>Noch kein Kaffee</small>";updateShareLink()}
function addCoffee(t){document.querySelectorAll('.submenu').forEach(m=>m.style.display="none");data.push({type:t,ts:Date.now()});saveLocal();render();if(mode==="nextcloud")ncSave(true)}
function delEntry(idx){data.splice(idx,1);saveLocal();render();if(mode==="nextcloud")ncSave(true)}
function exportJSON(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="coffee.json";a.click()}
function importJSON(e){let f=e.target.files[0];let r=new FileReader();r.onload=()=>{data=JSON.parse(r.result);saveLocal();render()};r.readAsText(f)}
function ncSave(s){let url=document.getElementById("ncUrl").value.trim().replace(/\/$/,""),u=document.getElementById("ncUser").value.trim(),p=document.getElementById("ncPass").value,pa=document.getElementById("ncPath").value;if(!url||!u||!p){if(!s)alert("Daten nötig");return}localStorage.setItem("nc_url",url);localStorage.setItem("nc_user",u);localStorage.setItem("nc_pass",p);localStorage.setItem("nc_path",pa);fetch(`${url}/remote.php/dav/files/${u}${pa}`,{method:"PUT",headers:{"Authorization":"Basic "+btoa(u+":"+p),"Content-Type":"application/json"},body:JSON.stringify(data)}).then(r=>document.getElementById("ncStatus").textContent=r.ok?"✓ gespeichert":"Fehler "+r.status)}
function ncLoad(){let url=document.getElementById("ncUrl").value.trim().replace(/\/$/,""),u=document.getElementById("ncUser").value.trim(),p=document.getElementById("ncPass").value,pa=document.getElementById("ncPath").value;fetch(`${url}/remote.php/dav/files/${u}${pa}`,{headers:{"Authorization":"Basic "+btoa(u+":"+p)}}).then(r=>r.json()).then(j=>{data=j;saveLocal();render();document.getElementById("ncStatus").textContent="✓ geladen "+j.length})}
setMode();render();
</script>

<div style="text-align:center">
  <a href="https://mondlicht-und-sterne.github.io/meissen/" target="_blank">
    <img src="https://img.shields.io/badge/MEISSEN-Kalender-f2f2f5?style=flat-square&labelColor=1a1a22&color=1a1a22" alt="Meissen Kalender">
  </a>
</div>
</body></html>
