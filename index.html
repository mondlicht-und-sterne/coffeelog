<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>coffee.log V8.4</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0f0f0f">
<style>
:root{--bg:#0f0f0f;--card:#191919;--b:#262626;--t:#f5f5f5;--m:#8a8a8a;--a:#d4a373}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:system-ui,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:18px}.h1{font-size:26px;font-weight:800}.sub{font-size:11px;color:var(--m)}
.search{width:100%;background:#1f1f1f;border:1px solid var(--b);border-radius:24px;padding:11px 40px;color:var(--t);outline:none}
.swrap{position:relative;margin:12px 0}.sicon{position:absolute;left:14px;top:11px;color:var(--m)}.clear{position:absolute;right:14px;top:11px;color:var(--m);cursor:pointer}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.chip{padding:6px 14px;border-radius:20px;background:var(--card);border:1px solid var(--b);color:var(--m);font-size:11px;cursor:pointer}.chip.on{background:var(--a);color:#000;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.card{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:12px}
.stat .k{font-size:9px;color:var(--m)}.stat .v{font-size:22px;font-weight:800}
.btn{background:var(--card);border:1px solid var(--b);border-radius:12px;padding:10px;color:var(--t);font-weight:600;cursor:pointer;width:100%}.btn-a{background:var(--a);color:#000}
.item{background:var(--card);border:1px solid var(--b);border-radius:14px;padding:10px 14px;margin:8px 0;display:flex;justify-content:space-between}
.box{background:var(--card);border:1px solid var(--b);border-radius:16px;padding:14px;margin-top:16px}.row{display:flex;gap:8px;margin-top:8px}.input{background:#1f1f1f;border:1px solid var(--b);border-radius:10px;padding:10px;color:var(--t);width:100%;font-size:13px}
.label{font-size:11px;color:var(--m);margin-top:10px}.radio{display:flex;gap:18px;font-size:13px;margin:8px 0}small{font-size:10px;color:var(--m)}
</style></head><body><div class="wrap">
<div class="h1">coffee.log V8.4</div><div class="sub">Lokal • optional Key • optional Nextcloud • Suche • Installierbar</div>
<div class="swrap"><span class="sicon">🔍</span><input id="search" class="search" placeholder="Suche: Espresso, gestern, stark..." oninput="render()"><span class="clear" onclick="document.getElementById('search').value='';render()">✕</span></div>
<div class="chips" id="chips"></div><div id="info" style="font-size:11px;color:var(--a)"></div>
<div class="grid" id="stats"></div><div class="grid" id="btns"></div><div id="list"></div>
<div class="box"><h3>⚙️ SPEICHER - Alles optional</h3>
<div class="radio"><label><input type="radio" name="mode" value="local" checked onchange="setMode()"> Lokal</label><label><input type="radio" name="mode" value="key" onchange="setMode()"> Key</label><label><input type="radio" name="mode" value="nextcloud" onchange="setMode()"> Nextcloud</label></div>
<small id="modeDesc"></small>
<div id="keyBox" style="display:none"><div class="label">Privater Key</div><div class="row"><input id="keyInput" class="input" placeholder="moooon-dresden-123"><button class="btn" style="width:100px" onclick="saveKey()">Setzen</button></div><div class="row"><input id="shareLink" class="input" readonly><button class="btn" style="width:100px" onclick="copyLink()">Copy</button></div></div>
<div id="ncBox" style="display:none"><input id="ncUrl" class="input" placeholder="https://cloud.example.com"><div class="row"><input id="ncUser" class="input" placeholder="User"><input id="ncPass" class="input" type="password" placeholder="App-Passwort"></div><input id="ncPath" class="input" value="/coffee.log/coffee.json"><div class="row"><button class="btn btn-a" onclick="ncSave()">Sync → Cloud</button><button class="btn" onclick="ncLoad()">← Laden</button></div><div id="ncStatus" style="font-size:10px;color:var(--a);margin-top:6px"></div></div>
<div class="row" style="margin-top:12px"><button class="btn" onclick="exportJSON()">Backup JSON</button><button class="btn" onclick="document.getElementById('imp').click()">Restore</button><input type="file" id="imp" hidden accept=".json" onchange="importJSON(event)"></div>
</div></div>
<script>
const TYPES=["Filter","Espresso","Cappuccino","Latte","Cold Brew","Decaf"];
let mode=localStorage.getItem("cl_mode")||"local",keyName=localStorage.getItem("cl_key")||"";
function sk(){return mode==="key"&&keyName?"coffee_"+keyName:"coffee_v84"}
function loadData(){try{return JSON.parse(localStorage.getItem(sk())||"[]")}catch{return[]}}
let data=loadData(),activeChip="Alle";
document.querySelector(`input[name=mode][value=${mode}]`).checked=true;setMode();
if(location.hash&&!keyName){keyName=location.hash.slice(1);localStorage.setItem("cl_key",keyName);mode="key";localStorage.setItem("cl_mode","key")}
function setMode(){mode=document.querySelector('input[name=mode]:checked').value;localStorage.setItem("cl_mode",mode);let kb=document.getElementById("keyBox"),nb=document.getElementById("ncBox"),d=document.getElementById("modeDesc");if(mode==="local"){kb.style.display="none";nb.style.display="none";d.textContent="Lokal: Jeder eigener Kaffee wie Flathub App."}if(mode==="key"){kb.style.display="block";nb.style.display="none";d.textContent="Key: URL enthält #key, trennt deine Daten.";updateShareLink()}if(mode==="nextcloud"){kb.style.display="none";nb.style.display="block";d.textContent="Nextcloud: Echter Sync über eigene Cloud."}data=loadData();render()}
function saveKey(){let v=document.getElementById("keyInput").value.trim().replace(/\s+/g,"-");if(!v)return alert("Key!");let old=loadData();keyName=v;localStorage.setItem("cl_key",keyName);localStorage.setItem(sk(),JSON.stringify(old));location.hash=v;updateShareLink();data=loadData();render()}
function updateShareLink(){let base=location.origin+location.pathname,k=keyName||"dein-key";document.getElementById("shareLink").value=base+"#"+k;document.getElementById("keyInput").value=keyName}
function copyLink(){let i=document.getElementById("shareLink");i.select();document.execCommand("copy")}
function saveLocal(){localStorage.setItem(sk(),JSON.stringify(data))}
function renderChips(){let c=document.getElementById("chips");c.innerHTML="";["Alle",...TYPES].forEach(t=>{let d=document.createElement("div");d.className="chip"+(activeChip===t?" on":"");d.textContent=t;d.onclick=()=>{activeChip=t;render()};c.appendChild(d)})}
function filtered(){let term=document.getElementById("search").value.toLowerCase().trim();return data.slice().reverse().filter(e=>{if(activeChip!=="Alle"&&e.type!==activeChip)return false;if(!term)return true;if(term==="heute")return new Date(e.ts).toDateString()===new Date().toDateString();if(term==="gestern"){let d=new Date();d.setDate(d.getDate()-1);return new Date(e.ts).toDateString()===d.toDateString()}return (e.type+" "+(e.note||"")+" "+new Date(e.ts).toLocaleDateString()).toLowerCase().includes(term)})}
function render(){renderChips();let f=filtered();document.getElementById("info").textContent=f.length+" Ergebnisse";let today=data.filter(d=>new Date(d.ts).toDateString()===new Date().toDateString()).length,week=data.filter(d=>(Date.now()-d.ts)/86400000<7).length;document.getElementById("stats").innerHTML=`<div class="card"><div class="stat"><div class="k">TODAY</div><div class="v">${today}</div></div></div><div class="card"><div class="stat"><div class="k">WEEK</div><div class="v">${week}</div></div></div><div class="card"><div class="stat"><div class="k">FILTER</div><div class="v">${f.length}</div></div></div>`;document.getElementById("btns").innerHTML=TYPES.map(t=>`<button class="btn" onclick="addCoffee('${t}')">${t} +</button>`).join("");document.getElementById("list").innerHTML=f.slice(0,80).map(e=>`<div class="item"><div><div style="font-size:9px;color:#8a8a8a">${new Date(e.ts).toLocaleString('de-DE')}</div><div style="font-weight:700">${e.type}</div><div style="font-size:9px;color:#8a8a8a">${e.note||""}</div></div><div>☕</div></div>`).join("")||"Noch kein Kaffee";updateShareLink()}
function addCoffee(t){let n=prompt("Notiz?")||"";data.push({type:t,note:n,ts:Date.now()});saveLocal();render();if(mode==="nextcloud")ncSave(true)}
function exportJSON(){let b=new Blob([JSON.stringify(data,null,2)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`coffee-${keyName||"local"}.json`;a.click()}
function importJSON(e){let file=e.target.files[0];let r=new FileReader();r.onload=()=>{let j=JSON.parse(r.result);data=j;saveLocal();render()};r.readAsText(file)}
function ncSave(s){let url=document.getElementById("ncUrl").value.trim().replace(/\/$/,""),user=document.getElementById("ncUser").value.trim(),pass=document.getElementById("ncPass").value,path=document.getElementById("ncPath").value;if(!url||!user||!pass){if(!s)alert("URL/User/Pass nötig");return}localStorage.setItem("nc_url",url);localStorage.setItem("nc_user",user);localStorage.setItem("nc_pass",pass);localStorage.setItem("nc_path",path);fetch(`${url}/remote.php/dav/files/${user}${path}`,{method:"PUT",headers:{"Authorization":"Basic "+btoa(user+":"+pass),"Content-Type":"application/json"},body:JSON.stringify(data)}).then(res=>{document.getElementById("ncStatus").textContent=res.ok?"✓ Gespeichert "+new Date().toLocaleTimeString():"Fehler "+res.status})}
function ncLoad(){let url=document.getElementById("ncUrl").value.trim().replace(/\/$/,""),user=document.getElementById("ncUser").value.trim(),pass=document.getElementById("ncPass").value,path=document.getElementById("ncPath").value;fetch(`${url}/remote.php/dav/files/${user}${path}`,{headers:{"Authorization":"Basic "+btoa(user+":"+pass)}}).then(r=>r.json()).then(j=>{data=j;saveLocal();render();document.getElementById("ncStatus").textContent="✓ Geladen "+j.length})}
render();
</script></body></html>
